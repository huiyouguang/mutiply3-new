<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkBuddy · 个人工作台</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb; --panel: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e7eaf0; --primary: #6366f1;
      --primary-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
      --radius: 16px; --radius-sm: 12px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
      --shadow-md: 0 6px 16px rgba(15,23,42,.07),0 2px 6px rgba(15,23,42,.04);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --ease: cubic-bezier(.22,.61,.36,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55; padding: 18px 22px 56px; max-width: 1400px; margin: 0 auto; -webkit-font-smoothing: antialiased; }
    body::before { content:''; position: fixed; inset: 0; z-index:-1; pointer-events:none;
      background: radial-gradient(58% 48% at 10% -6%, rgba(99,102,241,.10), transparent 60%),
                  radial-gradient(50% 44% at 96% 0%, rgba(236,72,153,.08), transparent 55%),
                  radial-gradient(46% 46% at 50% 112%, rgba(16,185,129,.06), transparent 60%); }
    header { position: sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:-18px -22px 22px; padding:14px 22px; background: rgba(255,255,255,.72); backdrop-filter: saturate(180%) blur(14px); border-bottom:1px solid var(--border); box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 24px rgba(15,23,42,.05); }
    .brand { background: var(--primary-grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .spacer { flex:1; }
    .panel { background:var(--panel); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-sm); padding:20px; transition: box-shadow .25s var(--ease), transform .25s var(--ease); }
    .panel:hover { box-shadow:var(--shadow-md); }
    .panel-title { font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .stat-card { background:var(--panel); border-radius:var(--radius-sm); border:1px solid var(--border); padding:16px; text-align:center; }
    .stat-value { font-size:28px; font-weight:800; line-height:1.1; }
    .stat-label { font-size:12px; color:var(--muted); margin-top:4px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:10px; border:none; font-family:var(--font); font-size:13px; font-weight:600; cursor:pointer; transition: all .2s var(--ease); }
    .btn-primary { background:var(--primary-grad); color:#fff; }
    .btn-primary:hover { opacity:.9; transform:translateY(-1px); }
    .btn-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
    .btn-outline:hover { border-color:var(--primary); color:var(--primary); }
    .tag { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    .tag-primary { background: rgba(99,102,241,.12); color:var(--primary); }
    .tag-success { background: rgba(16,185,129,.12); color:#10b981; }
    .tag-warning { background: rgba(245,158,11,.12); color:#f59e0b; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .progress-bar { height:6px; border-radius:3px; background: rgba(99,102,241,.12); overflow:hidden; }
    .progress-fill { height:100%; border-radius:3px; background:var(--primary-grad); transition: width .5s var(--ease); }
    .quick-actions { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
    .qa-btn { display:flex; align-items:center; gap:6px; padding:10px 18px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; transition: all .2s var(--ease); background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow-sm); color:var(--text); }
    .qa-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--primary); }
    .modal-overlay { position:fixed; inset:0; z-index:100; background: rgba(15,23,42,.4); backdrop-filter: blur(4px); display:flex; align-items:center; justify-content:center; }
    .modal { background:var(--panel); border-radius:var(--radius); border:1px solid var(--border); box-shadow:0 20px 48px rgba(15,23,42,.13); padding:28px; max-width:520px; width:90%; max-height:80vh; overflow-y:auto; }
    .modal h3 { font-size:18px; font-weight:700; margin-bottom:16px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:var(--muted); }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 14px; border-radius:10px; border:1.5px solid var(--border); font-family:var(--font); font-size:14px; color:var(--text); background:var(--panel); transition: border-color .2s var(--ease); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,.2); }
    .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
    .calendar-mini { text-align:center; margin-bottom:0; }
    .calendar-mini .date-big { font-size:48px; font-weight:800; line-height:1; background:var(--primary-grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .calendar-mini .month-label { font-size:16px; font-weight:600; color:var(--muted); margin-top:4px; }
    .toast { position:fixed; bottom:24px; right:24px; z-index:200; padding:12px 20px; border-radius:12px; font-size:14px; font-weight:600; animation: slideUp .3s var(--ease); box-shadow:0 12px 32px rgba(15,23,42,.15); }
    .toast-success { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .toast-error { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .loading { text-align:center; padding:60px; color:var(--muted); font-size:14px; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } .grid-4 { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">⏳ 正在加载 WorkBuddy 工作台...</div>
  </div>

  <script>
  (function () {
    "use strict";
    var API_BASE = "http://localhost:3001/api";

    // ============ State ============
    var state = {
      currentView: "dashboard",
      dashboard: null,
      healthToday: null,
      healthStats: null,
      moodToday: null,
      toast: null
    };
    var chatMessages = [];

    // ============ API ============
    function apiGet(url) {
      return fetch(API_BASE + url).then(function (r) { return r.json(); });
    }
    function apiPost(url, data) {
      return fetch(API_BASE + url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).then(function (r) { return r.json(); });
    }

    // ============ Toast ============
    function showToast(message, type) {
      state.toast = { message: message, type: type || "success", id: Date.now() };
      setTimeout(function () { state.toast = null; render(); }, 3000);
      render();
    }

    // ============ Date ============
    var now = new Date();
    var today = now.toISOString().split("T")[0];
    var todayDay = now.getDate();
    var todayMonth = now.getMonth() + 1;
    var weekDay = ["日","一","二","三","四","五","六"][now.getDay()];
    var monthNames = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
    var yearProgress = ((now.getMonth() + 1) / 12 * 100).toFixed(1);
    var monthProgress = (now.getDate() / new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() * 100).toFixed(1);
    var dayProgress = ((now.getHours() * 60 + now.getMinutes()) / 1440 * 100).toFixed(1);
    var weekProgress = ((now.getDay() || 7) / 7 * 100).toFixed(1);
    var cpaDate = new Date(2025, 7, 23);
    var cpaDiff = Math.ceil((cpaDate - now) / (1000 * 60 * 60 * 24));

    // ============ Helpers ============
    function ProgressBar(value, max, color) {
      max = max || 100; color = color || "#6366f1";
      var w = Math.min(Math.max((value / max) * 100, 0), 100);
      return '<div class="progress-bar"><div class="progress-fill" style="width:' + w + '%;background:' + color + '"></div></div>';
    }
    function StatCard(label, value, unit, icon) {
      return '<div class="stat-card">' +
        (icon ? '<div style="font-size:22px;margin-bottom:6px">' + icon + '</div>' : '') +
        '<div class="stat-value">' + value + '<span style="font-size:14px;font-weight:500;color:var(--muted)">' + (unit || "") + '</span></div>' +
        '<div class="stat-label">' + label + '</div></div>';
    }
    function Tag(text, type) {
      return '<span class="tag tag-' + (type || "primary") + '">' + text + '</span>';
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // ============ Views ============
    function renderDashboard() {
      var d = state.dashboard || {};
      var h = state.healthStats || {};
      return '<div>' +
        '<div class="grid-4">' +
          StatCard("今日笔记", d.todayNotes != null ? d.todayNotes : "-", "", "📝") +
          StatCard("睡眠", d.sleepAvg ? d.sleepAvg : "-", "h", "😴") +
          StatCard("运动", d.exerciseMinutes != null ? d.exerciseMinutes : "-", "min", "🏃") +
          StatCard("心情", d.moodAvg ? d.moodAvg : "-", "/5", "💭") +
        '</div>' +
        '<div class="grid-2" style="margin-top:18px">' +
          '<div class="panel"><div class="panel-title">⏳ 时间进度</div>' +
            '<div style="margin:8px 0">今日 ' + dayProgress + '% ' + ProgressBar(dayProgress) + '</div>' +
            '<div style="margin:8px 0">本周 ' + weekProgress + '% ' + ProgressBar(weekProgress, 100, "#10b981") + '</div>' +
            '<div style="margin:8px 0">本月 ' + monthProgress + '% ' + ProgressBar(monthProgress, 100, "#f59e0b") + '</div>' +
            '<div style="margin:8px 0">今年 ' + yearProgress + '% ' + ProgressBar(yearProgress, 100, "#ec4899") + '</div>' +
          '</div>' +
          '<div class="panel"><div class="panel-title">📊 健康概览（近7天）</div>' +
            '<div class="grid-2">' +
              StatCard("平均睡眠", h.sleepAvg ? h.sleepAvg : "-", "h", "😴") +
              StatCard("平均运动", h.exerciseAvg != null ? h.exerciseAvg : "-", "min", "🏃") +
              StatCard("平均饮水", h.waterAvg != null ? h.waterAvg : "-", "杯", "💧") +
            '</div>' +
            (cpaDiff > 0 ? '<div style="margin-top:12px;padding:10px;background:rgba(99,102,241,.06);border-radius:12px;text-align:center"><span style="font-size:13px;color:var(--muted)">📚 CPA 考试倒计时</span><span style="font-size:32px;font-weight:800;display:block;background:var(--primary-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">' + cpaDiff + ' 天</span></div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="quick-actions">' +
          '<button class="qa-btn" onclick="WB.go(\'health\')">🏥 健康记录</button>' +
          '<button class="qa-btn" onclick="WB.go(\'mood\')">💭 心情日记</button>' +
          '<button class="qa-btn" onclick="WB.go(\'chat\')">🤖 AI 助手</button>' +
          '<button class="qa-btn" onclick="WB.openFiles()">📂 文件浏览</button>' +
        '</div>' +
      '</div>';
    }

    function renderHealth() {
      var h = state.healthToday || {};
      var weekDays = ["日","一","二","三","四","五","六"];
      return '<div>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">' +
          '<button class="btn btn-outline" onclick="WB.go(\'dashboard\')">← 返回</button>' +
          '<h2 style="font-size:20px;font-weight:700">🏥 健康追踪</h2>' +
        '</div>' +
        '<div class="grid-2">' +
          '<div class="panel"><div class="panel-title">📅 ' + todayMonth + '月' + todayDay + '日 周' + weekDays[now.getDay()] +
            '<span style="flex:1"></span><button class="btn btn-primary" onclick="WB.healthForm()" style="font-size:12px;padding:6px 14px">✏️ 记录</button></div>' +
            '<div class="grid-2">' +
              '<div class="stat-card"><div style="font-size:22px;margin-bottom:4px">😴</div><div class="stat-value">' + (h.sleep || "-") + '<span style="font-size:14px;color:var(--muted)">h</span></div><div class="stat-label">睡眠</div></div>' +
              '<div class="stat-card"><div style="font-size:22px;margin-bottom:4px">🏃</div><div class="stat-value">' + (h.exerciseDuration || "-") + '<span style="font-size:14px;color:var(--muted)">min</span></div><div class="stat-label">' + (h.exercise || "运动") + '</div></div>' +
              '<div class="stat-card"><div style="font-size:22px;margin-bottom:4px">💧</div><div class="stat-value">' + (h.water || "-") + '<span style="font-size:14px;color:var(--muted)">杯</span></div><div class="stat-label">饮水</div></div>' +
              '<div class="stat-card"><div style="font-size:22px;margin-bottom:4px">⚖️</div><div class="stat-value">' + (h.weight || "-") + '<span style="font-size:14px;color:var(--muted)">kg</span></div><div class="stat-label">体重</div></div>' +
            '</div>' +
            (h.notes ? '<div style="margin-top:14px;padding:12px;background:rgba(99,102,241,.04);border-radius:12px;font-size:13px;color:var(--muted)">📝 ' + esc(h.notes) + '</div>' : '') +
          '</div>' +
          '<div class="panel"><div class="panel-title">🍽️ 饮食记录</div>' +
            row("🌅 早餐", h.breakfast) + row("☀️ 午餐", h.lunch) + row("🌆 晚餐", h.dinner) + row("🍿 零食", h.snacks) +
          '</div>' +
        '</div>' +
      '</div>';
    }
    function row(label, val) {
      return '<div style="padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px;color:var(--muted)">' + label + '</span><div style="font-size:14px;margin-top:2px">' + (val || "未记录") + '</div></div>';
    }

    function renderMood() {
      var m = state.moodToday || {};
      var emojis = ["", "😢", "😔", "😐", "🙂", "😄"];
      return '<div>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><button class="btn btn-outline" onclick="WB.go(\'dashboard\')">← 返回</button><h2 style="font-size:20px;font-weight:700">💭 心情日记</h2></div>' +
        '<div class="grid-2">' +
          '<div class="panel"><div class="panel-title">今日心情<span style="flex:1"></span><button class="btn btn-primary" onclick="WB.moodForm()" style="font-size:12px;padding:6px 14px">✏️ 记录</button></div>' +
            '<div style="text-align:center;padding:20px 0"><div style="font-size:64px">' + (emojis[m.mood] || "😐") + '</div><div style="font-size:24px;font-weight:700;margin-top:8px">' + (m.mood ? m.mood + "/5" : "今日未记录") + '</div>' +
            ((m.tags || []).length ? '<div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">' + m.tags.map(function(t){return Tag(esc(t));}).join("") + '</div>' : '') +
            '</div></div>' +
          '<div class="panel"><div class="panel-title">🌟 感恩日记</div>' +
            ((m.gratitude || []).length ? '<ul style="list-style:none;padding:0">' + m.gratitude.map(function(g){return '<li style="padding:8px 0;border-bottom:1px solid var(--border);font-size:14px">💫 ' + esc(g) + '</li>';}).join("") + '</ul>' : '<div style="text-align:center;padding:20px;color:var(--muted)">今天还没记录感恩事项</div>') +
          '</div>' +
        '</div>' +
        (m.content ? '<div class="panel" style="margin-top:18px"><div class="panel-title">📝 今日日记</div><div style="font-size:14px;line-height:1.8;white-space:pre-wrap">' + esc(m.content) + '</div></div>' : '') +
      '</div>';
    }

    function renderChat() {
      return '<div>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><button class="btn btn-outline" onclick="WB.go(\'dashboard\')">← 返回</button><h2 style="font-size:20px;font-weight:700">🤖 AI 助手</h2><span style="font-size:12px;color:var(--muted)">基于 CodeBuddy Agent SDK</span></div>' +
        '<div class="panel" style="min-height:400px;display:flex;flex-direction:column">' +
          '<div id="chat-messages" style="flex:1;overflow-y:auto;max-height:500px;padding:10px 0">' +
            (chatMessages.length === 0 ? '<div style="text-align:center;color:var(--muted);padding:40px">欢迎使用 WorkBuddy AI 助手！<br/>我可以帮你管理健康数据、记录心情、搜索笔记。</div>' : chatMessages.map(renderBubble).join("")) +
          '</div>' +
          '<div style="margin-top:16px;display:flex;gap:8px"><input type="text" id="chat-input" placeholder="输入消息..." style="flex:1;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);font-family:var(--font);font-size:14px" onkeypress="if(event.key===\'Enter\')WB.sendChat()" /><button class="btn btn-primary" onclick="WB.sendChat()">发送</button></div>' +
        '</div>' +
      '</div>';
    }
    function renderBubble(m) {
      return '<div style="margin:8px 0;padding:10px 14px;border-radius:12px;font-size:13px;' + (m.role === 'user' ? 'background:rgba(99,102,241,.08);margin-left:40px' : 'background:rgba(15,23,42,.04);margin-right:40px') + '"><div style="font-weight:600;font-size:11px;color:var(--muted);margin-bottom:4px">' + (m.role === 'user' ? '👤 你' : '🤖 WorkBuddy') + '</div>' + esc(m.content) + '</div>';
    }

    function renderHeader() {
      var views = [["dashboard","🏠"],["health","🏥"],["mood","💭"],["chat","🤖"]];
      var nav = views.map(function(v){
        var active = state.currentView === v[0];
        return '<button class="btn btn-outline" onclick="WB.go(\'' + v[0] + '\')" style="font-size:12px;padding:6px 12px;' + (active ? 'border-color:var(--primary);color:var(--primary);background:rgba(99,102,241,.06)' : '') + '">' + v[1] + '</button>';
      }).join("");
      return '<header>' +
        '<div><h1><span style="font-size:22px">⚡</span> <span class="brand">WorkBuddy</span></h1><div class="sub">个人工作台 · 文件逻辑与 Obsidian 主页一致</div></div>' +
        '<div class="spacer"></div>' +
        '<div class="calendar-mini"><div class="date-big">' + todayDay + '</div><div class="month-label">' + monthNames[todayMonth - 1] + ' · 周' + weekDay + '</div></div>' +
        '<div style="display:flex;align-items:center;gap:12px;margin-left:16px">' + nav + '</div>' +
      '</header>';
    }

    function render() {
      var app = document.getElementById("app");
      var viewHtml = "";
      switch (state.currentView) {
        case "health": viewHtml = renderHealth(); break;
        case "mood": viewHtml = renderMood(); break;
        case "chat": viewHtml = renderChat(); break;
        default: viewHtml = renderDashboard();
      }
      app.innerHTML = renderHeader() + viewHtml +
        (state.toast ? '<div class="toast toast-' + state.toast.type + '" id="toast-' + state.toast.id + '">' + esc(state.toast.message) + '</div>' : '');
    }

    // ============ Data ============
    function loadDashboard() {
      return apiGet("/dashboard").then(function (r) { state.dashboard = r.data; render(); })
        .catch(function () { state.dashboard = null; render(); });
    }
    function loadHealthStats() {
      return apiGet("/health/stats").then(function (r) { state.healthStats = r.data; render(); }).catch(function(){});
    }
    function loadHealth() {
      return apiGet("/health/today").then(function (r) { state.healthToday = r.data; render(); }).catch(function(){});
    }
    function loadMood() {
      return apiGet("/mood/today").then(function (r) { state.moodToday = r.data; render(); }).catch(function(){});
    }

    // ============ Actions ============
    var WB = {
      go: function (v) {
        state.currentView = v;
        if (v === "health") loadHealth();
        if (v === "mood") loadMood();
        if (v === "dashboard") { loadDashboard(); loadHealthStats(); }
        render();
        if (v === "chat") { var i = document.getElementById("chat-input"); if (i) i.focus(); }
      },
      openFiles: function () {
        apiGet("/list").then(function (r) {
          if (!r.success) { showToast("无法读取目录", "error"); return; }
          var files = r.data || [];
          var modal = document.createElement("div");
          modal.className = "modal-overlay";
          modal.innerHTML = '<div class="modal" style="max-width:600px"><h3>📂 Vault 目录</h3><div style="max-height:400px;overflow-y:auto">' +
            files.map(function (f) { return '<div style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;display:flex;align-items:center;gap:8px">' + (f.indexOf('.md') > -1 ? '📝' : '📁') + ' ' + esc(f) + '</div>'; }).join("") +
            '</div><div class="form-actions"><button class="btn btn-outline" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button></div></div>';
          document.body.appendChild(modal);
          modal.onclick = function (e) { if (e.target === modal) modal.remove(); };
        }).catch(function () { showToast("读取目录失败", "error"); });
      },
      healthForm: function () {
        var h = state.healthToday || {};
        var modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.innerHTML = '<div class="modal"><h3>✏️ 记录健康数据 - ' + todayMonth + '月' + todayDay + '日</h3>' +
          fld("睡眠时长 (小时)", "hf-sleep", "number", h.sleep, "0.1") +
          fld("睡眠质量 (1-5)", "hf-sq", "number", h.sleepQuality, "1") +
          fld("运动类型", "hf-ex", "text", h.exercise, "") +
          fld("运动时长 (分钟)", "hf-ed", "number", h.exerciseDuration, "") +
          fld("饮水 (杯)", "hf-water", "number", h.water, "") +
          fld("早餐", "hf-bf", "text", h.breakfast, "") +
          fld("午餐", "hf-lunch", "text", h.lunch, "") +
          fld("晚餐", "hf-dinner", "text", h.dinner, "") +
          fld("体重 (kg)", "hf-weight", "number", h.weight, "0.1") +
          '<div class="form-group"><label>备注</label><textarea id="hf-notes" rows="2">' + esc(h.notes || "") + '</textarea></div>' +
          '<div class="form-actions"><button class="btn btn-outline" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn btn-primary" id="save-health">保存</button></div></div>';
        document.body.appendChild(modal);
        modal.querySelector("#save-health").onclick = function () {
          var data = {
            date: today,
            sleep: parseFloat(modal.querySelector("#hf-sleep").value) || 0,
            sleepQuality: parseInt(modal.querySelector("#hf-sq").value) || 0,
            exercise: modal.querySelector("#hf-ex").value,
            exerciseDuration: parseInt(modal.querySelector("#hf-ed").value) || 0,
            water: parseInt(modal.querySelector("#hf-water").value) || 0,
            breakfast: modal.querySelector("#hf-bf").value,
            lunch: modal.querySelector("#hf-lunch").value,
            dinner: modal.querySelector("#hf-dinner").value,
            snacks: "",
            weight: parseFloat(modal.querySelector("#hf-weight").value) || 0,
            notes: modal.querySelector("#hf-notes").value
          };
          apiPost("/health", data).then(function (r) {
            if (r.success) { showToast("健康数据已保存"); loadHealth(); loadHealthStats(); loadDashboard(); }
            else showToast("保存失败", "error");
          }).catch(function () { showToast("保存失败", "error"); });
          modal.remove();
        };
        modal.onclick = function (e) { if (e.target === modal) modal.remove(); };
      },
      moodForm: function () {
        var m = state.moodToday || {};
        var modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.innerHTML = '<div class="modal"><h3>💭 记录心情 - ' + todayMonth + '月' + todayDay + '日</h3>' +
          '<div class="form-group"><label>心情指数 (1-5)</label><div style="display:flex;gap:10px;margin-top:6px">' +
            [1,2,3,4,5].map(function (i) { return '<button type="button" class="mood-btn" data-val="' + i + '" style="font-size:36px;cursor:pointer;border:none;background:none;opacity:' + (m.mood === i ? '1' : '0.4') + '">' + ['', '😢','😔','😐','🙂','😄'][i] + '</button>'; }).join("") +
          '</div></div>' +
          '<input type="hidden" id="mf-mood" value="' + (m.mood || 3) + '" />' +
          fld("标签", "mf-tags", "text", (m.tags || []).join(","), "开心,学习,运动") +
          '<div class="form-group"><label>日记内容</label><textarea id="mf-content" rows="4">' + esc(m.content || "") + '</textarea></div>' +
          '<div class="form-group"><label>感恩事项（每行一个）</label><textarea id="mf-gratitude" rows="3">' + esc((m.gratitude || []).join("\n")) + '</textarea></div>' +
          '<div class="form-actions"><button class="btn btn-outline" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn btn-primary" id="save-mood">保存</button></div></div>';
        document.body.appendChild(modal);
        modal.querySelectorAll(".mood-btn").forEach(function (btn) {
          btn.onclick = function () {
            modal.querySelectorAll(".mood-btn").forEach(function (b) { b.style.opacity = "0.4"; });
            btn.style.opacity = "1";
            modal.querySelector("#mf-mood").value = btn.getAttribute("data-val");
          };
        });
        modal.querySelector("#save-mood").onclick = function () {
          var data = {
            date: today,
            mood: parseInt(modal.querySelector("#mf-mood").value),
            tags: modal.querySelector("#mf-tags").value.split(",").map(function (t) { return t.trim(); }).filter(Boolean),
            content: modal.querySelector("#mf-content").value,
            gratitude: modal.querySelector("#mf-gratitude").value.split("\n").filter(Boolean)
          };
          apiPost("/mood", data).then(function (r) {
            if (r.success) { showToast("心情日记已保存"); loadMood(); }
            else showToast("保存失败", "error");
          }).catch(function () { showToast("保存失败", "error"); });
          modal.remove();
        };
        modal.onclick = function (e) { if (e.target === modal) modal.remove(); };
      },
      sendChat: function () {
        var input = document.getElementById("chat-input");
        var text = (input && input.value || "").trim();
        if (!text) return;
        chatMessages.push({ role: "user", content: text });
        chatMessages.push({ role: "assistant", content: "思考中..." });
        input.value = "";
        render();
        apiPost("/chat", { message: text }).then(function (r) {
          chatMessages = chatMessages.filter(function (m) { return m.content !== "思考中..."; });
          if (r.success) {
            var last = r.data && r.data[r.data.length - 1];
            chatMessages.push({ role: "assistant", content: (last && last.content && last.content[0] && last.content[0].text) || "完成" });
          } else {
            chatMessages.push({ role: "assistant", content: "出错了: " + (r.error || "未知错误") });
          }
          render();
        }).catch(function (e) {
          chatMessages = chatMessages.filter(function (m) { return m.content !== "思考中..."; });
          chatMessages.push({ role: "assistant", content: "连接失败: " + e.message });
          render();
        });
      }
    };
    function fld(label, id, type, val, step) {
      return '<div class="form-group"><label>' + label + '</label><input id="' + id + '" type="' + type + '" value="' + esc(val || "") + '"' + (step ? ' step="' + step + '"' : '') + ' /></div>';
    }
    window.WB = WB;

    // ============ Init ============
    render();
    Promise.all([loadDashboard(), loadHealthStats(), loadHealth(), loadMood()]).then(function () {
      render();
    });
  })();
script>
</body>
</html>
